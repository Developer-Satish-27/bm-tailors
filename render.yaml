services:
  - type: web
    name: bm-tailors
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: AUTH_SECRET
        value: "bmt-production-secret-session-salt-change-in-production-2026"
      - key: NODE_VERSION
        value: "20.18.0"
